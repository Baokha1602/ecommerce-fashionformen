    password: ${MAIL_PASSWORD:wfqz dahf nsla qlwp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

