spring:
  application:
    name: day1

  output:
    ansi:
      enabled: always

  profiles:
    active: ${APP_PROFILE:dev}


  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:demorandomotp@gmail.com}
    password: ${MAIL_PASSWORD:wfqz dahf nsla qlwp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080


app:
  jwt:
    issuer: yoedu-ecommerce
    secret: ${JWT_SECRET:yoedu-demo-secret-key-12345678901234567890123456789012}
    access-token-ttl-minutes: 480
    refresh-token-ttl-days: 7

  order:
    shipping-fee: 30000
    payment-timeout-minutes: 15
    point-per-amount: 1000

  vnpay:
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    tmn-code: ${VNPAY_TMN_CODE:SANDBOX}
    hash-secret: ${VNPAY_HASH_SECRET:SANDBOX_SECRET}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}

  momo:
    endpoint: https://test-payment.momo.vn/v2/gateway/api/create
    partner-code: ${MOMO_PARTNER_CODE:SANDBOX}
    access-key: ${MOMO_ACCESS_KEY:SANDBOX_KEY}
    secret-key: ${MOMO_SECRET_KEY:SANDBOX_SECRET}
    return-url: ${MOMO_RETURN_URL:http://localhost:5173/payment/momo/return}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}


