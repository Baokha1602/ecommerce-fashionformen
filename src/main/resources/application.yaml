spring:
  application:
    name: day1

  output:
    ansi:
      enabled: always

  profiles:
    active: ${APP_PROFILE:dev}

  # Đã đưa jpa vào đúng phân cấp dưới spring
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Đã đưa flyway vào đúng phân cấp dưới spring
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

